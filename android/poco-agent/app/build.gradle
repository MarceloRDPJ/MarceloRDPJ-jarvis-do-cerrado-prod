plugins { id 'com.android.application' }

android {
    namespace 'br.com.jarviscerrado.poco'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'br.com.jarviscerrado.poco'
        minSdk 31
        targetSdk 35
        versionCode 28
        versionName '0.8.3'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    testImplementation 'junit:junit:4.13.2'
}
