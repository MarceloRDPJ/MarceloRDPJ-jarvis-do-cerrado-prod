plugins { id 'com.android.application' }

android {
    namespace 'br.com.jarviscerrado.poco'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'br.com.jarviscerrado.poco'
        minSdk 31
        targetSdk 35
        versionCode 32
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    // Variante bundled: o modelo vai dentro do APK. A alternativa
    // (play-services-mlkit-barcode-scanning) baixa o modelo na primeira leitura,
    // e a primeira leitura e justamente quando o proprietario esta esperando o
    // Pix — falhar ali por download de modelo seria falhar sem motivo.
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    testImplementation 'junit:junit:4.13.2'
}
